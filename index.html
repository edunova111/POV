<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Baile Real - 80 Anos Rainha Ilda</title>


<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>


<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">


<link rel="stylesheet" href="style.css">


<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">


<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>


</head>


<body>


<div class="camera-body">


    <div class="camera-flash-bar">


        <div class="viewfinder-lens"></div>


        <div class="flash-bulb">

            <i class="fa-solid fa-bolt"></i>

        </div>


    </div>





    <div class="card">



        <div class="badge-container">

            <i class="fa-solid fa-crown crown-icon"></i>

        </div>




        <h1>Baile Real</h1>


        <h2>80 Anos Rainha Ilda</h2>





        <p class="subtitle">

            Sua câmera descartável digital da festa.

            Tire fotos, divirta-se e eternize este momento conosco!

        </p>





        <div class="input-group">


            <label for="nome">

                <i class="fa-solid fa-user"></i>

                Identifique-se (Opcional)

            </label>




            <input

                id="nome"

                type="text"

                placeholder="Digite seu nome ou família"

            >


        </div>







        <div id="preview-container" style="display:none;">


            <img id="preview" alt="Prévia da foto">


        </div>








        <div class="actions-container">





            <label class="btn-style btn-camera">


                <i class="fa-solid fa-camera-retro"></i>


                Tirar Foto


                <input

                    id="input-camera"

                    type="file"

                    accept="image/*"

                    capture="environment"

                >


            </label>









            <label class="btn-style btn-gallery">


                <i class="fa-solid fa-images"></i>


                Escolher da Galeria



                <input

                    id="input-galeria"

                    type="file"

                    accept="image/*"

                >



            </label>








            <button

                id="btnAlbum"

                class="btn-style btn-view-album"

                type="button"

            >


                <i class="fa-solid fa-photo-film"></i>


                Ver Álbum de Fotos



            </button>






        </div>









        <div class="footer-note">


            ✨ Cada clique vai direto para o álbum da Rainha Ilda ✨


        </div>






    </div>





</div>






<script src="script.js"></script>


</body>


</html>
